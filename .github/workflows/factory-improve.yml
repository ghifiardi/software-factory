# SELF-IMPROVEMENT LOOP — reusable, called weekly from the PRIVATE data repo
# (templates/data-repo/). The PR itself goes to the public factory repo.
#   agent    reads the eval digest and edits files only (no shell, no git, read-only token)
#   publish  fresh runner: applies the agent's diff, refuses anything outside
#            improve.writable_paths, then commits, pushes and opens the PR with
#            FACTORY_TOKEN so factory-validate runs and CODEOWNERS review applies.
name: factory-improve

on:
  workflow_call:
    inputs:
      factory_repo:
        description: Public factory repo with the code, prompts and config (owner/name)
        type: string
        required: true
      factory_ref:
        type: string
        default: main
    secrets:
      ANTHROPIC_API_KEY:
        required: false   # inference.provider: anthropic-api
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false   # inference.provider: claude-subscription
      GATEWAY_KEY:
        required: false   # inference.provider: gateway
      FACTORY_TOKEN:
        required: true   # pushes the proposal branch and opens the PR in the factory repo

permissions: {}

concurrency:
  group: factory-improve
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      model: ${{ steps.cfg.outputs.model }}
      provider: ${{ steps.cfg.outputs.provider }}
      session_id: ${{ steps.agent.outputs.session_id }}
      started_at: ${{ steps.start.outputs.at }}
    steps:
      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: factory-data
          path: data
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      - run: python scripts/factory.py digest --data-dir data --days 30 --out eval_digest.md
      - run: cat eval_digest.md >> "$GITHUB_STEP_SUMMARY"

      - id: cfg
        run: python scripts/factory.py render --workflow improve --var "date=$(date -u +%F)"

      - name: Check inference credentials
        env:
          FACTORY_HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          FACTORY_HAS_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          FACTORY_HAS_GATEWAY_KEY: ${{ secrets.GATEWAY_KEY != '' }}
        run: python scripts/factory.py check-inference

      # Headless session: when the agent ends its turn the run is over, so it must never
      # leave work in the background. Long timeouts let full test suites run in the foreground.
      - name: Non-interactive agent settings
        run: |
          {
            echo "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1"
            echo "BASH_DEFAULT_TIMEOUT_MS=1200000"
            echo "BASH_MAX_TIMEOUT_MS=2400000"
          } >> "$GITHUB_ENV"

      # inference.provider = gateway: a local shim fixes the request shape for the gateway
      # and adds GATEWAY_KEY, which only this step and the shim process see.
      - name: Start the gateway shim
        if: steps.cfg.outputs.provider == 'gateway'
        env:
          GATEWAY_URL: ${{ steps.cfg.outputs.gateway_url }}
          GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
          AGENT_MODEL: ${{ steps.cfg.outputs.model }}
        run: |
          cp scripts/gateway_shim.py "$RUNNER_TEMP/gateway_shim.py"   # copy before the agent can touch the tree
          nohup python3 "$RUNNER_TEMP/gateway_shim.py" 8787 > "$RUNNER_TEMP/gateway_shim.log" 2>&1 &
          for _ in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 0.5; done
          {
            echo "ANTHROPIC_BASE_URL=http://127.0.0.1:8787"
            echo "ANTHROPIC_DEFAULT_SONNET_MODEL=$AGENT_MODEL"
            echo "ANTHROPIC_DEFAULT_HAIKU_MODEL=$AGENT_MODEL"
            echo "ANTHROPIC_DEFAULT_OPUS_MODEL=$AGENT_MODEL"
          } >> "$GITHUB_ENV"

      - id: agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ steps.cfg.outputs.provider == 'anthropic-api' && secrets.ANTHROPIC_API_KEY || steps.cfg.outputs.provider == 'gateway' && 'gateway-shim' || '' }}
          claude_code_oauth_token: ${{ steps.cfg.outputs.provider == 'claude-subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.cfg.outputs.prompt }}
          claude_args: ${{ steps.cfg.outputs.claude_args }}

      - name: Export the agent's proposal as a patch
        if: always()
        env:
          EXEC_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          git add -A -- . ':(exclude)data' ':(exclude)eval_digest.md' ':(exclude)PR_BODY.md'
          git diff --cached --binary --no-renames > "$RUNNER_TEMP/out/proposal.patch"
          if [ -f PR_BODY.md ]; then head -c 20000 PR_BODY.md > "$RUNNER_TEMP/out/PR_BODY.md"; fi
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then cp "$EXEC_FILE" "$RUNNER_TEMP/out/execution.json"; fi
          cp eval_digest.md "$RUNNER_TEMP/out/"
          wc -c "$RUNNER_TEMP/out/proposal.patch"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-improve-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          retention-days: 3

  publish:
    needs: agent
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # session record → factory-data in the data repo (proposal branch + PR use FACTORY_TOKEN)
    env:
      REPO: ${{ github.repository }}            # the data repo (session record metadata)
      FACTORY_REPO: ${{ inputs.factory_repo }}  # where the proposal PR is opened
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: factory-data
          path: data
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: factory-improve-${{ github.run_id }}
          path: ${{ runner.temp }}/in

      # Trusted copy of the control script, taken BEFORE the patch touches the tree.
      - run: |
          cp scripts/factory.py scripts/push_data.sh "$RUNNER_TEMP/"
          cp -r factory "$RUNNER_TEMP/factory-pristine"

      - name: Apply proposal and enforce writable_paths
        id: policy
        run: |
          patch="$RUNNER_TEMP/in/proposal.patch"
          if [ ! -s "$patch" ]; then echo "verdict=nochange" >> "$GITHUB_OUTPUT"; exit 0; fi
          # git apply refuses paths outside the work tree, inside .git, and writes through symlinks.
          if ! git apply --index "$patch"; then
            echo "verdict=violated" >> "$GITHUB_OUTPUT"; echo "::error::proposal patch does not apply cleanly"; exit 0
          fi
          git diff --cached --name-only -z --no-renames > "$RUNNER_TEMP/files.bin"
          if python "$RUNNER_TEMP/factory.py" --config "$RUNNER_TEMP/factory-pristine/factory.yaml" \
               check-paths --allowlist --files-from "$RUNNER_TEMP/files.bin" > "$RUNNER_TEMP/policy.txt" 2>&1; then
            echo "verdict=ok" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=violated" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/policy.txt"

      - name: Discard a violating proposal
        if: steps.policy.outputs.verdict == 'violated'
        run: |
          git reset -q --hard
          echo "::error::Self-improvement proposal touched files outside improve.writable_paths — discarded."

      - name: Commit, push and open the PR
        if: steps.policy.outputs.verdict == 'ok'
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}   # PRs opened with GITHUB_TOKEN would not trigger factory-validate
        run: |
          br="factory-improve/$(date -u +%F)-${{ github.run_id }}"
          git switch -q -c "$br"
          git -c user.name=factory-bot -c user.email=factory-bot@users.noreply.github.com commit -qm "factory: self-improvement proposal $(date -u +%F)"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FACTORY_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$(printf 'x-access-token:%s' "$FACTORY_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$auth" push -q origin "HEAD:refs/heads/$br"
          body="$RUNNER_TEMP/in/PR_BODY.md"
          if [ ! -s "$body" ]; then
            body="$RUNNER_TEMP/default_body.md"
            printf 'Weekly self-improvement proposal. The agent did not write a description; see the eval digest in the workflow run.\n' > "$body"
          fi
          printf '\n\n---\n_Opened by factory-improve run %s. Changes are limited to improve.writable_paths; human review required._\n' \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$body"
          gh pr create --repo "$FACTORY_REPO" --base main --head "$br" \
            --title "factory(self-improvement): $(date -u +%F)" --body-file "$body" \
            --label factory:self-improvement \
          || gh pr create --repo "$FACTORY_REPO" --base main --head "$br" \
            --title "factory(self-improvement): $(date -u +%F)" --body-file "$body"

      - name: No change proposed
        if: steps.policy.outputs.verdict == 'nochange'
        run: echo "::notice::The improvement agent proposed no change this week."

      - name: Record session
        if: always()
        env:
          SESSION_ID: ${{ needs.agent.outputs.session_id }}
          CONCLUSION: ${{ needs.agent.result }}
          MODEL: ${{ needs.agent.outputs.model }}
          PROVIDER: ${{ needs.agent.outputs.provider }}
          STARTED: ${{ needs.agent.outputs.started_at }}
          VERDICT: ${{ steps.policy.outputs.verdict }}
        run: >
          python "$RUNNER_TEMP/factory.py" --config "$RUNNER_TEMP/factory-pristine/factory.yaml"
          record-session --data-dir data --workflow improve --repo "$REPO"
          --execution-file "$RUNNER_TEMP/in/execution.json" --session-id "$SESSION_ID"
          --conclusion "$CONCLUSION" --model "$MODEL" --provider "$PROVIDER" --started-at "$STARTED"
          --violations "$( [ "$VERDICT" = violated ] && echo 'outside improve.writable_paths' )"
          --run-id "${{ github.run_id }}"

      - name: Push session record
        if: always()
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          bash "$RUNNER_TEMP/push_data.sh" data "session: improve $(date -u +%F)"

      - name: Fail the run on a violating proposal
        if: steps.policy.outputs.verdict == 'violated'
        run: exit 1
