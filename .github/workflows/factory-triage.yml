# TRIAGE stage — reusable, called from each PRODUCT repo when an issue is opened.
# The agent only labels and comments. Same job split as implement: the agent job
# never holds FACTORY_TOKEN.
name: factory-triage

on:
  workflow_call:
    inputs:
      factory_repo:
        description: Central factory repo (owner/name)
        type: string
        required: true
      factory_ref:
        type: string
        default: main
      data_repo:
        description: Private repo whose factory-data branch holds session records (owner/name)
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      FACTORY_TOKEN:
        required: true
      FACTORY_LOG_KEY:
        required: false   # private half of factory/log_public_key.pem

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      prompt: ${{ steps.cfg.outputs.prompt }}
      claude_args: ${{ steps.cfg.outputs.claude_args }}
      model: ${{ steps.cfg.outputs.model }}
      started_at: ${{ steps.start.outputs.at }}
      log_public_key: ${{ steps.logkey.outputs.pem }}
    steps:
      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          token: ${{ secrets.FACTORY_TOKEN }}
          path: .factory
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.data_repo }}
          ref: factory-data
          token: ${{ secrets.FACTORY_TOKEN }}
          path: .factory-data
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      - name: Load the log-encryption public key
        id: logkey
        run: |
          if [ -f .factory/factory/log_public_key.pem ]; then
            { echo 'pem<<PEM_EOF'; cat .factory/factory/log_public_key.pem; echo 'PEM_EOF'; } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::factory/log_public_key.pem missing — transcripts will not be kept"
          fi

      # Repo must be allowed, the author trusted per trust.triage_author_associations
      # (empty = anyone), and the factory under its hard budget. Blocked = silent skip.
      - name: Gate — repo allowlist · author trust · monthly budget
        id: gate
        env:
          ASSOC: ${{ github.event.issue.author_association }}
        run: |
          if python .factory/scripts/factory.py check-access --repo "$REPO" --author-association "$ASSOC" --stage triage \
             && python .factory/scripts/factory.py check-budget --data-dir .factory-data; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - id: cfg
        if: steps.gate.outputs.allowed == 'true'
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: >
          python .factory/scripts/factory.py render --workflow triage
          --var "repo=$REPO" --var "issue_number=$ISSUE" --var "base_branch=$BASE"

  agent:
    needs: prepare
    if: needs.prepare.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    outputs:
      session_id: ${{ steps.agent.outputs.session_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false   # triage never pushes
      - id: agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ needs.prepare.outputs.prompt }}
          claude_args: ${{ needs.prepare.outputs.claude_args }}
      # Public repos expose workflow artifacts to anyone, so the raw run log leaves this
      # job only encrypted to the factory's public key (no secret is needed to encrypt).
      - name: Encrypt the execution log for the record job
        id: enc
        if: always() && steps.agent.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.agent.outputs.execution_file }}
          LOG_PUBLIC_KEY: ${{ needs.prepare.outputs.log_public_key }}
        run: |
          out="$RUNNER_TEMP/factory-log"; mkdir -p "$out"
          if [ -z "$LOG_PUBLIC_KEY" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::warning::no factory/log_public_key.pem (run scripts/bootstrap.sh) or no log — transcript not kept"
            exit 0
          fi
          printf '%s\n' "$LOG_PUBLIC_KEY" > "$RUNNER_TEMP/log_pub.pem"
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/log_key.txt"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$EXEC_FILE" -out "$out/execution.json.enc" -pass "file:$RUNNER_TEMP/log_key.txt"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/log_pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/log_key.txt" -out "$out/key.enc"
          rm -f "$RUNNER_TEMP/log_key.txt"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Keep the encrypted log for the record job
        if: always() && steps.enc.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: factory-exec-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-log
          retention-days: 1
          if-no-files-found: ignore

  record:
    needs: [prepare, agent]
    if: always() && needs.prepare.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          token: ${{ secrets.FACTORY_TOKEN }}
          path: .factory
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.data_repo }}
          ref: factory-data
          token: ${{ secrets.FACTORY_TOKEN }}
          path: .factory-data
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: factory-exec-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exec

      - name: Decrypt the execution log
        if: always()
        env:
          LOG_KEY: ${{ secrets.FACTORY_LOG_KEY }}
        run: |
          d="$RUNNER_TEMP/exec"
          if [ -z "$LOG_KEY" ] || [ ! -f "$d/key.enc" ]; then echo "no encrypted log — recording metadata only"; exit 0; fi
          umask 077
          printf '%s\n' "$LOG_KEY" > "$RUNNER_TEMP/log_priv.pem"
          if openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/log_priv.pem" \
               -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
               -in "$d/key.enc" -out "$RUNNER_TEMP/log_key.txt" \
             && openssl enc -d -aes-256-cbc -pbkdf2 -in "$d/execution.json.enc" -out "$d/execution.json" -pass "file:$RUNNER_TEMP/log_key.txt"; then
            echo "log decrypted"
          else
            echo "::warning::could not decrypt the run log (FACTORY_LOG_KEY does not match factory/log_public_key.pem?)"
          fi
          rm -f "$RUNNER_TEMP/log_priv.pem" "$RUNNER_TEMP/log_key.txt" "$d/key.enc" "$d/execution.json.enc"
      - name: Record session
        env:
          SESSION_ID: ${{ needs.agent.outputs.session_id }}
          CONCLUSION: ${{ needs.agent.result }}
          MODEL: ${{ needs.prepare.outputs.model }}
          STARTED: ${{ needs.prepare.outputs.started_at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          exec_file="$RUNNER_TEMP/exec/execution.json"
          python .factory/scripts/factory.py record-session --data-dir .factory-data \
            --workflow triage --repo "$REPO" --issue "$ISSUE" --execution-file "$exec_file" \
            --session-id "$SESSION_ID" --conclusion "$CONCLUSION" --model "$MODEL" \
            --run-id "$RUN_ID" --run-url "$RUN_URL" --started-at "$STARTED"
      - name: Push session record
        env:
          PUSH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: |
          .factory/scripts/push_data.sh .factory-data "session: triage $REPO#$ISSUE"
